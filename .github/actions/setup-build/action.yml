name: Set up the engine build
description: >
  Per-OS toolchain for the CMake presets: system packages / Vulkan SDK /
  Homebrew Vulkan-on-Metal, the pinned Slang compiler, vcpkg at the manifest
  baseline with the binary cache restored, and (Windows) the MSVC developer
  environment. Shared by ci.yml and release.yml. The cache is only restored
  here; the caller saves it right after configure (composite actions have no
  post step) under the `cache-key` output.

inputs:
  vcpkg-commit:
    description: vcpkg commit; must equal vcpkg.json's builtin-baseline.
    default: 10ceb139a610ebf3c6aa49cdc4a4b7f3db5d3f2b
  slang-version:
    description: Slang release used on every OS (update the SHA-256s with it).
    default: 2025.6.1
  slang-sha256-linux:
    description: SHA-256 of slang-<version>-linux-x86_64.tar.gz.
    default: 836c8a23b5619dcfec13676c924ddadb46d8dd5e82cae2cad26d3a28da4d7538
  slang-sha256-macos:
    description: SHA-256 of slang-<version>-macos-aarch64.tar.gz.
    default: b2684ad6050a0adb4779605e2632a03fff1fc27cd5265010ff59877b4a59bbea
  slang-sha256-windows:
    description: SHA-256 of slang-<version>-windows-x86_64.zip.
    default: 47ef4f7f2df17f9965612bc39e63dac0d9748985887339bb5f11f2d931c0cb61
  vulkan-sdk-version:
    description: Windows only (headers, import library, loader runtime, lavapipe).
    default: 1.4.321.1
  extra-apt-packages:
    description: Additional Ubuntu packages (e.g. xvfb patchelf for packaging).
    default: ""

outputs:
  cache-key:
    description: Key to save the vcpkg binary cache under (per run).
    value: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # ---- Linux: clang + libc++, SDL3's X11/Wayland deps, lavapipe ----------
    - name: System packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # The runner image ships Microsoft's apt repo; nothing here comes from it,
        # and when it refuses (403) apt-get update fails the whole job.
        sudo find /etc/apt/sources.list.d -maxdepth 1 -name 'microsoft*' -delete
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang libc++-dev libc++abi-dev ninja-build cmake pkg-config \
          libx11-dev libxext-dev libxft-dev libxcursor-dev libxrandr-dev libxi-dev \
          libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev \
          libwayland-dev wayland-protocols libegl-dev libdecor-0-dev \
          libvulkan-dev mesa-vulkan-drivers autoconf automake libtool \
          ${{ inputs.extra-apt-packages }}

    # ---- Windows: full SDK (headers, vulkan-1.lib) + loader runtime --------
    # engine_tests links vulkan-1.dll, so even the CPU tests need it, and the
    # runner image is not relied on for it. Lavapipe is registered as an ICD
    # for the GPU suites and the packaged-game smoke test.
    - name: Vulkan SDK + lavapipe (Windows)
      if: runner.os == 'Windows'
      uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
      with:
        vulkan_version: ${{ inputs.vulkan-sdk-version }}
        install_runtime: true
        install_lavapipe: true
        cache: true
        stripdown: true

    - name: Vulkan runtime on PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "$env:VULKAN_SDK\runtime\x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    # ---- macOS: Homebrew's loader + MoltenVK ICD ---------------------------
    # VULKAN_SDK points CMake's FindVulkan at the Homebrew prefix.
    - name: Homebrew packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install cmake ninja pkgconf molten-vk vulkan-loader vulkan-headers vulkan-tools
        echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

    # ---- Slang: the same release everywhere (added to PATH after the SDK,
    # whose own slangc it shadows), checked against pinned SHA-256s ---------
    - name: Slang compiler (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SLANG_VERSION: ${{ inputs.slang-version }}
        SHA_LINUX: ${{ inputs.slang-sha256-linux }}
        SHA_MACOS: ${{ inputs.slang-sha256-macos }}
      run: |
        case "$RUNNER_OS" in
          Linux) asset="linux-x86_64"; sha="$SHA_LINUX"; check="sha256sum -c" ;;
          macOS) asset="macos-aarch64"; sha="$SHA_MACOS"; check="shasum -a 256 -c" ;;
        esac
        mkdir -p "$HOME/slang"
        curl -fsSL -o "$RUNNER_TEMP/slang.tgz" \
          "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-${asset}.tar.gz"
        echo "$sha  $RUNNER_TEMP/slang.tgz" | $check
        tar -xzf "$RUNNER_TEMP/slang.tgz" -C "$HOME/slang"
        echo "$HOME/slang/bin" >> "$GITHUB_PATH"

    - name: Slang compiler (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SLANG_VERSION: ${{ inputs.slang-version }}
        SHA_WINDOWS: ${{ inputs.slang-sha256-windows }}
      run: |
        $url = "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\slang.zip"
        $hash = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\slang.zip").Hash
        if ($hash -ne $env:SHA_WINDOWS) { throw "slang.zip SHA-256 mismatch: $hash" }
        Expand-Archive "$env:RUNNER_TEMP\slang.zip" -DestinationPath "$env:USERPROFILE\slang"
        "$env:USERPROFILE\slang\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    # ---- vcpkg at the manifest baseline; binary cache in the workspace -----
    # (CMakePresets expect it at ~/vcpkg, %USERPROFILE%\vcpkg on Windows.)
    - name: vcpkg (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        VCPKG_COMMIT: ${{ inputs.vcpkg-commit }}
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
        git -C "$HOME/vcpkg" checkout "$VCPKG_COMMIT"
        "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-archives"
        echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-archives,readwrite" >> "$GITHUB_ENV"

    - name: vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VCPKG_COMMIT: ${{ inputs.vcpkg-commit }}
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
        if ($LASTEXITCODE) { exit 1 }
        git -C "$env:USERPROFILE\vcpkg" checkout $env:VCPKG_COMMIT
        if ($LASTEXITCODE) { exit 1 }
        & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE) { exit 1 }
        New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\.vcpkg-archives" | Out-Null
        "VCPKG_BINARY_SOURCES=clear;files,$env:GITHUB_WORKSPACE\.vcpkg-archives,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # Cache entries are immutable, so every run saves under its own key and
    # restores the newest one with the same prefix: a partial dependency build
    # (a failed run) is kept and completed next time.
    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-archives
        key: vcpkg-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'ports/**') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'ports/**') }}-
          vcpkg-${{ runner.os == 'Linux' && 'linux' || runner.os == 'Windows' && 'windows' || 'macos' }}-${{ inputs.vcpkg-commit }}-

    # Last PATH-changing step: it snapshots PATH (SDK, runtime, slangc) and
    # puts MSVC's tools ahead of Git's link.exe. (It also points VCPKG_ROOT at
    # Visual Studio's bundled vcpkg; the presets' CMAKE_TOOLCHAIN_FILE wins.)
    - name: MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64
