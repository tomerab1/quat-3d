name: Release

# Downloadable builds of the game/editor for Linux, Windows and macOS, of the
# sample game made with it (games/coin-collector, ROADMAP P4), and of the
# engine SDK (ROADMAP P8, docs/sdk.md).
#   - Tag push v*: build, package, smoke-test, publish a GitHub Release whose
#     notes are docs/releases/<tag>.md (required unless the tag is a
#     prerelease) followed by GitHub's generated PR list. See docs/RELEASING.md.
#   - workflow_dispatch: the same builds, uploaded as workflow artifacts only
#     (a playable test build of the sample game per OS).
# Packaging: scripts/package-release.sh (engine) and quat-pack (games, which
# lays out through the same script); smoke test (launch the unpacked package
# headless for 30 frames): scripts/smoke-test-package.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            preset: release
          - name: windows-x64
            runner: windows-2022
            preset: windows-release
          - name: macos-arm64
            runner: macos-15
            preset: macos-release
    steps:
      - uses: actions/checkout@v4

      # Fail a release tag without curated notes now, not after the builds;
      # the publish job resolves the same file (docs/RELEASING.md).
      - name: Release notes present
        if: github.ref_type == 'tag'
        shell: bash
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      # Every archive ships THIRD_PARTY_NOTICES.md: its summary must list every
      # vcpkg dependency, FetchContent package and font (as in CI).
      - name: Third-party notices
        if: runner.os == 'Linux'
        run: python3 -I scripts/check-third-party-notices.py

      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          extra-apt-packages: xvfb patchelf

      # ENGINE_PACKAGE_BUILD: no build-machine paths in the binary; the game
      # finds its data next to the executable.
      - name: Configure
        id: configure
        run: cmake --preset ${{ matrix.preset }} -DENGINE_PACKAGE_BUILD=ON -DENGINE_PROFILE=OFF -DENGINE_VALIDATE_SHADERS=ON

      # Not on tag refs: tag runs restore the caches master/CI built but never
      # add their own (a tag's cache would only serve that one tag).
      - name: Save vcpkg binary cache
        if: always() && steps.setup.outputs.cache-key != '' && github.ref_type != 'tag'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Build
        if: steps.configure.outcome == 'success'
        run: cmake --build --preset ${{ matrix.preset }} --target game quat-player quat-player-shipping quat-pack

      # quat-mcp ships next to the game in every archive. Same toolchain as
      # CI's quat-mcp job (tools/quat-mcp/rust-toolchain.toml).
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@fa51344246423bb1896f389ae2a83b9784ddb363 # 1.97.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/quat-mcp
          # Like the vcpkg cache: tag runs restore, never save.
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Build quat-mcp
        working-directory: tools/quat-mcp
        run: cargo build --release --locked

      # Tags must look like v1.2.3 or v1.2.3-rc.1: the version ends up in file
      # names, Info.plist and the release title.
      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag '$GITHUB_REF_NAME' is not a release version (v1.2.3 or v1.2.3-rc.1)"
              exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Git Bash on Windows (inside the MSVC environment: the MSVC runtime
      # DLLs are copied from VCToolsRedistDir).
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: build/${{ matrix.preset }}
        run: |
          bash scripts/package-release.sh "$BUILD_DIR" dist "$VERSION" | tee package.log
          archive=$(tail -n1 package.log)
          echo "archive=dist/$(basename "$archive")" >> "$GITHUB_OUTPUT"
          ls -l dist

      # The sample game through quat-pack (packaged before any smoke test: the
      # macOS one uninstalls Homebrew's Vulkan, which the bundle copies from).
      # It ships LICENSE and the THIRD_PARTY_NOTICES.md the Package step above
      # wrote to $BUILD_DIR (no quat-mcp crates), found next to quat-player;
      # without them the layout fails.
      # A package build of quat-pack has no source-tree defaults, so the
      # shaders and the layout scripts are passed explicitly. Tags package the
      # game's own version; other runs add the commit as the build id.
      - name: Package the sample game
        id: package-game
        shell: bash
        env:
          BUILD_DIR: build/${{ matrix.preset }}
        run: |
          build_id=()
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then build_id=(--build-id "dev.${GITHUB_SHA::7}"); fi
          "$BUILD_DIR/quat-pack" games/coin-collector --player "$BUILD_DIR/quat-player" \
            --out dist-game --shaders cooked/shaders --engine-root . "${build_id[@]}" | tee pack.log
          archive=$(sed -n 's/^\[pack\] package //p' pack.log | tail -n1)
          [ -n "$archive" ] || { echo "::error::quat-pack wrote no package"; exit 1; }
          echo "archive=dist-game/$(basename "$archive")" >> "$GITHUB_OUTPUT"
          ls -l dist-game

      # Unpacked under a directory with a space and a non-ASCII character:
      # the game must resolve its data through UTF-8-safe paths.
      - name: Smoke test (launch the package headless)
        timeout-minutes: 15
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: bash scripts/smoke-test-package.sh "$ARCHIVE" "$RUNNER_TEMP/smoke dir ü 画"

      # The game must boot its start scene from the package, found next to
      # the executable, under the same non-ASCII path.
      - name: Smoke test the sample game
        timeout-minutes: 15
        shell: bash
        env:
          ARCHIVE: ${{ steps.package-game.outputs.archive }}
        run: |
          bash scripts/smoke-test-package.sh "$ARCHIVE" "$RUNNER_TEMP/game smoke ü 画" \
            --exe coin-collector --expect "[game] start scene loaded"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: quat-3d-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          # Already compressed.
          compression-level: 0

      - name: Upload the sample game
        uses: actions/upload-artifact@v4
        with:
          name: coin-collector-${{ matrix.name }}
          path: ${{ steps.package-game.outputs.archive }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload smoke-test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/smoke dir ü 画/smoke.log
            ${{ runner.temp }}/smoke dir ü 画/smoke.ppm
            ${{ runner.temp }}/game smoke ü 画/smoke.log
            ${{ runner.temp }}/game smoke ü 画/smoke.ppm
            pack.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore

      # ---- Engine SDK (ROADMAP P8, docs/sdk.md) ---------------------------
      # The same release build installed as an SDK. Before it is archived,
      # ctest -L sdk installs it into a fresh prefix and builds + tests
      # examples/sdk-consumer and the public headers against that prefix
      # alone. Uploaded as quat-3d-sdk-<os>, so the publish job's quat-3d-*
      # download attaches quat3d-sdk-<version>-<os>.{tar.gz,zip} to the release.
      # The smoke test above uninstalled Homebrew's Vulkan loader and MoltenVK
      # (proving the .app bundle carries its own); the SDK build, its
      # consumer check and every game built against it need them again.
      - name: Restore Homebrew Vulkan (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk vulkan-loader vulkan-tools

      - name: SDK build (libraries, tools)
        run: cmake --build --preset ${{ matrix.preset }}

      # The runner's default shell, not bash: under Git Bash on Windows,
      # link.exe resolves to Git's coreutils `link` instead of MSVC's linker.
      # (A no-op when an earlier step already built quat-mcp.)
      - name: SDK quat-mcp
        working-directory: tools/quat-mcp
        run: cargo build --release --locked

      - name: SDK check (install + sdk-consumer)
        run: ctest --test-dir build/${{ matrix.preset }} -L sdk --output-on-failure

      - name: SDK package
        id: sdk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: build/${{ matrix.preset }}
        run: |
          bash scripts/package-sdk.sh "$BUILD_DIR" dist-sdk "$VERSION" | tee sdk.log
          archive=$(tail -n1 sdk.log)
          echo "archive=dist-sdk/$(basename "$archive")" >> "$GITHUB_OUTPUT"
          ls -l dist-sdk

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: quat-3d-sdk-${{ matrix.name }}
          path: ${{ steps.sdk.outputs.archive }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # This job holds a write token: actions pinned by commit, and the checkout
    # is only the release notes and their resolver, without a stored token.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            docs/releases
            scripts
          persist-credentials: false

      # docs/releases/<tag>.md, required unless the tag is a prerelease
      # (scripts/release-notes.sh; empty output = generated notes only).
      - name: Release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          body_path=$(bash scripts/release-notes.sh "$TAG")
          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quat-3d-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coin-collector-*
          path: dist
          merge-multiple: true

      # With both set, action-gh-release v3 puts the body_path file first and
      # GitHub's generated notes (the merged PRs, "Full Changelog") below it.
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: ${{ steps.notes.outputs.body_path }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
