name: CI

# Pushes to master, pull requests, and manual runs (workflow_dispatch, e.g. to
# build a feature branch on all three platforms). Cycle branches (claude/**)
# are built through their PR; building them on push too ran every commit twice.
# Docs-only changes skip CI: nothing in the build or tests reads them. The
# Markdown under tools/quat-mcp/content/ is compiled into quat-mcp
# (include_str!), so it still triggers a build, and THIRD_PARTY_NOTICES.md is
# checked against vcpkg.json; later patterns win.
on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.gitattributes'
      - 'tools/quat-mcp/content/**'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.gitattributes'
      - 'tools/quat-mcp/content/**'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      mvk_debug:
        description: 'macOS: run the GPU tests with MoltenVK debug logging + shader dump (artifact macos-mvk-debug)'
        type: boolean
        default: false

# A running build is never cancelled: a new push waits for it (GitHub keeps
# only the newest pending run per group), so every build finishes even while
# commits land frequently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Toolchain pins (vcpkg baseline, Slang, Vulkan SDK) live in the shared
# .github/actions/setup-build action, also used by release.yml.

jobs:
  linux:
    name: Linux (clang + libc++, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Builds and runs code from the PR: read-only token, not persisted in the
    # checkout. Publishing screenshots happens in publish-screenshots below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every vcpkg dependency, FetchContent package and bundled font has a
      # licence row in THIRD_PARTY_NOTICES.md, which ships in every release
      # archive (scripts/third-party-notices.sh).
      - name: Third-party notices
        run: python3 -I scripts/check-third-party-notices.py

      # xvfb: the Screenshots step runs the game under xvfb-run. patchelf: the
      # package_licences test lays out a game package (scripts/package-release.sh).
      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          extra-apt-packages: xvfb patchelf

      # The release preset compiles the Tracy client in (ENGINE_PROFILE=ON,
      # on demand: it costs nothing without a viewer), so the tests run with
      # it; the no-editor game below keeps ENGINE_PROFILE=OFF compiling.
      - name: Configure
        id: configure
        run: cmake --preset release

      # Saved right after configure (where vcpkg builds the dependencies) and
      # even when configure fails, so neither a dependency failure nor a later
      # engine compile/test failure discards the dependencies already built.
      - name: Save vcpkg binary cache
        if: always() && steps.setup.outputs.cache-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Build
        id: build
        if: steps.configure.outcome == 'success'
        run: cmake --build --preset release

      # Mesa's software Vulkan driver. The manifest's file name differs between
      # distro releases (lvp_icd.json on Ubuntu 24.04, lvp_icd.<arch>.json
      # elsewhere), so find it instead of hard-coding it.
      - name: Tests (CPU + GPU on lavapipe)
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          echo "Using Vulkan ICD: $icd"
          export VK_ICD_FILENAMES="$icd"
          # Includes the engine SDK guards (label sdk, ROADMAP P8): install
          # into a fresh prefix, build + test examples/sdk-consumer against
          # it alone, self-contained public headers, refusals, layering.
          ctest --test-dir build/release --output-on-failure --timeout 900

      # The game without the editor layer (and without Tracy) compiles other
      # code paths (it broke once unnoticed). Shares the release build's vcpkg_installed tree, so
      # no dependency is rebuilt; only the `game` target is built. Manifest
      # install is off: with ENGINE_PROFILE=OFF the manifest no longer asks
      # for the `profiling` feature, and an install would remove Tracy from
      # the shared tree under the release build.
      - name: Build game without the editor (ENGINE_EDITOR=OFF, ENGINE_PROFILE=OFF)
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          cmake --preset release -B build/release-noeditor \
            -DENGINE_PROFILE=OFF -DENGINE_EDITOR=OFF -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/build/release/vcpkg_installed"
          cmake --build build/release-noeditor --target game

      # CC0 Poly Haven assets of the showcase scenes (assets/showcase/*/assets.json),
      # downloaded and cooked with this build's quat-cook. Two caches: the
      # downloads (keyed on the manifests, which pin each asset's content, and
      # the fetch script) and the cooked GLBs (also keyed on the cooker
      # sources), so a cooker change re-cooks without re-downloading ~560 MB.
      # Most runs only verify checksums. A Poly Haven outage or a slow cook
      # does not fail the job (continue-on-error, timeout): ci-screenshots.sh
      # then skips the scenes whose assets are missing.
      - name: Restore showcase downloads
        id: showcase-downloads
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/meshes/polyhaven
            !assets/meshes/polyhaven/*/*.glb
            !assets/meshes/polyhaven/*/*.cook-stamp
            assets/textures/polyhaven
            assets/hdri/polyhaven
          key: showcase-downloads-${{ hashFiles('assets/showcase/**/assets.json', 'scripts/fetch-polyhaven.py') }}

      - name: Restore showcase cooked models
        id: showcase-cooked
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/meshes/polyhaven/*/*.glb
            assets/meshes/polyhaven/*/*.cook-stamp
          key: showcase-cooked-${{ hashFiles('assets/showcase/**/assets.json', 'src/cook/**', 'include/engine/cook/**', 'tools/quat-cook/**') }}

      - name: Fetch showcase assets
        id: showcase-fetch
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          for manifest in assets/showcase/*/assets.json; do
            python3 scripts/fetch-polyhaven.py "$manifest" --cook-with build/release/quat-cook
          done

      - name: Save showcase downloads
        if: ${{ !cancelled() && steps.showcase-fetch.outcome == 'success' && steps.showcase-downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            assets/meshes/polyhaven
            !assets/meshes/polyhaven/*/*.glb
            !assets/meshes/polyhaven/*/*.cook-stamp
            assets/textures/polyhaven
            assets/hdri/polyhaven
          key: ${{ steps.showcase-downloads.outputs.cache-primary-key }}

      - name: Save showcase cooked models
        if: ${{ !cancelled() && steps.showcase-fetch.outcome == 'success' && steps.showcase-cooked.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            assets/meshes/polyhaven/*/*.glb
            assets/meshes/polyhaven/*/*.cook-stamp
          key: ${{ steps.showcase-cooked.outputs.cache-primary-key }}

      # Real engine frames on lavapipe under Xvfb (scripts/ci-screenshots.sh),
      # also when the tests failed. continue-on-error is TEMPORARY, until the
      # headless scenes have proven stable in CI: a crashed or hung scene is
      # reported (step summary + ::error annotation) without failing the job.
      - name: Screenshots
        id: shots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: scripts/ci-screenshots.sh build/release/game screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() && steps.shots.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      # Not covered by the Screenshots step's continue-on-error: a capture that
      # rendered but is wrong fails the job — an exact-black block (a NaN/Inf
      # spreading through the HDR chain, issue #45) in any scene, or an editor
      # capture without the docked editor UI (scripts/check_capture.py, run by
      # ci-screenshots.sh).
      - name: Capture checks
        if: ${{ !cancelled() && steps.shots.outcome != 'skipped' }}
        run: |
          if [ ! -f screenshots/results.tsv ]; then
            echo "::warning title=Capture checks::no screenshots/results.tsv (the Screenshots step did not get as far as rendering)"
            exit 0
          fi
          bad=$(awk -F'\t' '$2 ~ /^bad capture/ {print $1 ": " $2}' screenshots/results.tsv)
          if [ -n "$bad" ]; then
            while IFS= read -r line; do
              echo "::error title=Bad capture::$line"
            done <<<"$bad"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logs
          path: |
            build/release/vcpkg-manifest-install.log
            build/release/Testing/Temporary/LastTest.log
            build/release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  # Commits the linux job's screenshots to the ci-screenshots branch
  # (runs/<pr-N|branch>/<sha>/, index.md newest first) and shows them inline
  # in the step summary, so they can be viewed without downloading the
  # artifact. The only job with a write token; it runs no build output, and
  # never for fork PRs. Runs also when the linux job failed (a bad capture is
  # exactly what needs looking at).
  publish-screenshots:
    name: Publish screenshots
    needs: linux
    if: >-
      ${{ !cancelled() &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # One group per PR / branch, not one for the whole repository: GitHub keeps
    # at most one *pending* job per concurrency group, so a shared group made
    # each new publish replace (cancel) another PR's waiting one. Publishes of
    # different PRs may run at once: scripts/ci-publish-screenshots.sh only
    # appends commits and re-applies its run on the new tip when a push loses
    # a race. Within one PR a newer head's publish supersedes the older one.
    concurrency:
      group: ci-screenshots-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-screenshots
          path: screenshots

      - name: Publish screenshots
        if: ${{ steps.download.outcome == 'success' && hashFiles('screenshots/results.tsv') != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: scripts/ci-publish-screenshots.sh screenshots

  windows:
    name: Windows (MSVC, lavapipe)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Vulkan SDK + runtime + lavapipe, Slang, vcpkg, MSVC developer env.
      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Configure
        id: configure
        run: cmake --preset windows-release

      - name: Save vcpkg binary cache
        if: always() && steps.setup.outputs.cache-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      # -k 0: report every failing translation unit in one run.
      - name: Build
        id: build
        if: steps.configure.outcome == 'success'
        run: cmake --build --preset windows-release -- -k 0

      # -V + GTEST_BRIEF: per-binary summary (passed / skipped counts) in the log.
      - name: Tests (CPU)
        env:
          GTEST_BRIEF: 1
        run: ctest --test-dir build/windows-release -R engine_tests_cpu -V --timeout 900

      - name: Tests (GPU on lavapipe)
        if: always() && steps.build.outcome == 'success'
        env:
          GTEST_BRIEF: 1
        run: |
          vulkaninfoSDK --summary
          ctest --test-dir build/windows-release -R engine_tests_gpu -V --timeout 900

      # Engine SDK (P8): install into a fresh prefix, then build and test
      # examples/sdk-consumer and the public headers against it alone.
      - name: SDK (install + consumer)
        if: always() && steps.build.outcome == 'success'
        run: ctest --test-dir build/windows-release -L sdk --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: |
            build/windows-release/vcpkg-manifest-install.log
            build/windows-release/Testing/Temporary/LastTest.log
            build/windows-release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  macos:
    name: macOS (Apple clang, MoltenVK)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Homebrew Vulkan loader + MoltenVK, Slang, vcpkg.
      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Configure
        id: configure
        run: cmake --preset macos-release

      - name: Save vcpkg binary cache
        if: always() && steps.setup.outputs.cache-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Build
        id: build
        if: steps.configure.outcome == 'success'
        run: cmake --build --preset macos-release -- -k 0

      - name: Tests (CPU)
        env:
          GTEST_BRIEF: 1
        run: ctest --test-dir build/macos-release -R engine_tests_cpu -V --timeout 900

      # Engine SDK (P8): install into a fresh prefix, then build and test
      # examples/sdk-consumer and the public headers against it alone.
      - name: SDK (install + consumer)
        if: always() && steps.build.outcome == 'success'
        run: ctest --test-dir build/macos-release -L sdk --output-on-failure

      # Every cooked shader through SPIRV-Cross (Homebrew's CLI; MoltenVK
      # embeds the same library at its own pinned revision) and Apple's Metal
      # compiler: names the shader and the translator's error, which MoltenVK
      # reports only as a failed vkCreate*Pipelines (issue #103).
      # Informational, like the GPU step; the mvk_debug input shows MoltenVK's
      # own translation.
      - name: MSL translation check (informational)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          # The step's default shell has no pipefail: without it the filter
          # (which always matches the summary line) would hide a failure.
          set -o pipefail
          brew install spirv-cross
          scripts/msl-check.sh cooked/shaders "$RUNNER_TEMP/msl" | grep -v '^ok '

      # Apple Silicon runners expose a paravirtualised Metal device, so the GPU
      # suites run through MoltenVK (all of them passed on the first S4 runs).
      # Informational for now (not a gate) while MoltenVK on the runner's
      # virtual GPU builds a track record; ROADMAP P1 makes it a gate.
      - name: Tests (GPU on MoltenVK, informational)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GTEST_BRIEF: 1
          MVK_DEBUG_REQUESTED: ${{ inputs.mvk_debug }}
        run: |
          prefix="$(brew --prefix molten-vk)"
          icd=$(ls "$prefix"/etc/vulkan/icd.d/MoltenVK_icd.json "$prefix"/share/vulkan/icd.d/MoltenVK_icd.json 2>/dev/null | head -n1)
          echo "Using Vulkan ICD: $icd"
          export VK_ICD_FILENAMES="$icd"
          vulkaninfo --summary || true
          # Opt-in (workflow_dispatch input mvk_debug): MoltenVK's debug log,
          # with the MSL of every converted shader, plus a dump of all SPIR-V
          # and MSL it saw (docs/DEVELOPMENT.md, "Debugging MoltenVK").
          if [ "$MVK_DEBUG_REQUESTED" = true ]; then
            export MVK_CONFIG_LOG_LEVEL=4 MVK_CONFIG_DEBUG=1
            export MVK_CONFIG_SHADER_DUMP_DIR="$RUNNER_TEMP/mvk-debug/shaders"
            mkdir -p "$RUNNER_TEMP/mvk-debug"
            ctest --test-dir build/macos-release -R engine_tests_gpu -V --timeout 900 \
              > "$RUNNER_TEMP/mvk-debug/gpu-tests.log" 2>&1 || status=$?
            grep -E '^\[ *(FAILED|PASSED) *\]|mvk-error' "$RUNNER_TEMP/mvk-debug/gpu-tests.log" | head -n 200
            exit "${status:-0}"
          fi
          ctest --test-dir build/macos-release -R engine_tests_gpu -V --timeout 900

      - name: Upload MoltenVK debug log
        if: always() && inputs.mvk_debug
        uses: actions/upload-artifact@v4
        with:
          name: macos-mvk-debug
          path: ${{ runner.temp }}/mvk-debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            build/macos-release/vcpkg-manifest-install.log
            build/macos-release/Testing/Temporary/LastTest.log
            build/macos-release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  rust:
    name: quat-mcp (Rust fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/quat-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        # Same version as tools/quat-mcp/rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/quat-mcp

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Every crate in Cargo.lock declares an accepted licence; release
      # archives ship quat-mcp with its crates' licence texts.
      - name: Licences
        run: python3 -I ../../scripts/rust-notices.py check Cargo.toml
