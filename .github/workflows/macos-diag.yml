name: macOS pipeline diagnostics (temporary, issue #103)

# TEMPORARY: removed before the fix's PR leaves draft. Builds the GPU tests on
# macOS only and captures why MoltenVK fails to create the GBuffer pipelines:
#   * static: every cooked entry point (the train's shaders and the fixed
#     ones) through SPIRV-Cross + the Metal compiler (scripts/msl-check.sh);
#   * runtime: a narrow test filter on the train's shaders and on the fixed
#     ones with MoltenVK's debug log and shader dump, then every GPU test.
on:
  push:
    branches: [feat/macos-pipeline-diag]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: macOS MoltenVK pipeline diagnostics
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Train shaders (before the fix)
        run: |
          git fetch --depth=1 origin claude/nifty-hopper-nb68qe
          mkdir -p "$RUNNER_TEMP/orig"
          git archive FETCH_HEAD assets/shaders | tar x -C "$RUNNER_TEMP/orig"

      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Configure
        id: configure
        run: cmake --preset macos-release

      - name: Save vcpkg binary cache
        if: always() && steps.setup.outputs.cache-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Build tests
        run: cmake --build --preset macos-release --target engine_tests

      - name: Tool versions
        run: |
          brew install spirv-cross spirv-tools
          brew info molten-vk | head -n 3
          spirv-cross --revision || true
          xcrun -sdk macosx metal --version || echo "no metal compiler"
          prefix="$(brew --prefix molten-vk)"
          icd=$(ls "$prefix"/etc/vulkan/icd.d/MoltenVK_icd.json "$prefix"/share/vulkan/icd.d/MoltenVK_icd.json 2>/dev/null | head -n1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          tests=$(find build/macos-release -name engine_tests -type f -perm -u+x | head -n1)
          echo "ENGINE_TESTS=$tests" >> "$GITHUB_ENV"
          echo "engine_tests: $tests"

      # cooked-orig/ = the train's shaders (before the fix), for MoltenVK's own
      # error on the original pipelines.
      - name: Cook the train's shaders
        run: |
          set -e
          src="$RUNNER_TEMP/orig/assets/shaders" out="$RUNNER_TEMP/cooked-orig"
          mkdir -p "$out/materials"
          for f in "$src"/lib/*.slang; do
            slangc "$f" -I "$src/lib" -o "$out/$(basename "$f" .slang).slang-module"
          done
          for f in "$src"/*.slang; do
            n=$(basename "$f" .slang)
            slangc "$f" -I "$src/lib" -target spirv -emit-spirv-directly -fvk-use-entrypoint-name \
              -o "$out/$n.spv" -reflection-json "$out/$n.json"
          done
          for f in "$src"/materials/*.slang; do
            n=$(basename "$f" .slang)
            slangc "$f" "$out/material_pass_gbuffer.slang-module" -I "$src/lib" -I "$out" \
              -target spirv -emit-spirv-directly -fvk-use-entrypoint-name \
              -o "$out/materials/$n.gbuffer.spv" -reflection-json "$out/materials/$n.gbuffer.json"
          done

      - name: MSL check (static)
        continue-on-error: true
        run: |
          rc=0
          for d in "$RUNNER_TEMP/cooked-orig" cooked/shaders; do
            name=$(basename "$d")
            scripts/msl-check.sh "$d" "$RUNNER_TEMP/msl-$name" > "$RUNNER_TEMP/msl-$name.txt" || rc=1
            echo "== $d"; grep -v '^ok' "$RUNNER_TEMP/msl-$name.txt" | head -n 40
          done
          exit $rc

      - name: Narrow GPU run with MoltenVK debug log (train shaders, then fixed)
        continue-on-error: true
        env:
          MVK_CONFIG_LOG_LEVEL: "4"
          MVK_CONFIG_DEBUG: "1"
        run: |
          filter='GpuInstancing.RendersEveryInstanceOfOneInstancedDraw:GpuParticleDraw.WeightedBlendedOitIsOrderIndependent:GpuTerrainPass.RasterisesTheTileUnderTheCamera:GpuGrass.DrawWritesBladesIntoTheGBuffer:GpuVelocity.TranslatingQuadMatchesItsScreenMotion:GpuVelocity.SkinnedMeshMatchesCpuSkinning'
          run() { # <label>
            MVK_CONFIG_SHADER_DUMP_DIR="$RUNNER_TEMP/mvk-dump-$1" \
              "$ENGINE_TESTS" --require-gpu --gtest_filter="$filter" \
              > "$RUNNER_TEMP/mvk-$1.log" 2>&1 || true
          }
          mv cooked/shaders cooked/shaders.fixed
          cp -R "$RUNNER_TEMP/cooked-orig" cooked/shaders
          run orig
          rm -rf cooked/shaders; mv cooked/shaders.fixed cooked/shaders
          run fixed
          wc -l "$RUNNER_TEMP"/mvk-*.log

      - name: Tests (GPU on MoltenVK, fixed shaders)
        continue-on-error: true
        env:
          GTEST_BRIEF: 1
        run: |
          "$ENGINE_TESTS" --require-gpu --gtest_filter='Gpu*' > "$RUNNER_TEMP/gpu-full.log" 2>&1 || true
          tail -n 5 "$RUNNER_TEMP/gpu-full.log"

      # Everything worth reading, last, so the end of the job log holds it.
      - name: Summary
        if: always()
        run: |
          echo "== versions"
          brew list --versions molten-vk vulkan-loader spirv-cross || true
          for f in "$RUNNER_TEMP"/msl-*.txt; do echo "== $(basename "$f")"; grep -v '^ok' "$f" | head -n 12; done
          for l in orig fixed; do
            f="$RUNNER_TEMP/mvk-$l.log"
            echo "== narrow run, $l shaders: results"
            grep -E '^\[ *(OK|FAILED|PASSED) *\]' "$f" | head -n 20 || true
            echo "== narrow run, $l shaders: MoltenVK errors (first 25 matching lines, cut to 300 chars)"
            grep -i -E 'mvk-error|error:|failed|cannot|compil' "$f" | grep -v '^\[ *FAILED' | cut -c1-300 | head -n 25 || true
          done
          echo "== full GPU run"
          grep -E '^\[ *(FAILED|PASSED) *\]|tests from .* ran' "$RUNNER_TEMP/gpu-full.log" | sort -u | head -n 80 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-mvk-diagnostics
          path: |
            ${{ runner.temp }}/mvk-*.log
            ${{ runner.temp }}/mvk-dump-*/
            ${{ runner.temp }}/msl-*.txt
            ${{ runner.temp }}/msl-*/*.metal
            ${{ runner.temp }}/gpu-full.log
          retention-days: 7
          if-no-files-found: ignore
