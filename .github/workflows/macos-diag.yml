name: macOS pipeline diagnostics (temporary, issue #103)

# TEMPORARY: removed before the fix's PR leaves draft. Builds the GPU tests on
# macOS only and captures why MoltenVK fails to create the GBuffer pipelines:
#   * static: every cooked entry point (the train's shaders, the fixed ones,
#     and single-suspect variants of gbuffer.slang) through SPIRV-Cross + the
#     Metal compiler (scripts/msl-check.sh);
#   * runtime: a narrow test filter on the train's shaders and on the fixed
#     ones with MoltenVK's debug log and shader dump, then every GPU test.
on:
  push:
    branches: [feat/macos-pipeline-diag]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: macOS MoltenVK pipeline diagnostics
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Train shaders (before the fix)
        run: |
          git fetch --depth=1 origin claude/nifty-hopper-nb68qe
          mkdir -p "$RUNNER_TEMP/orig"
          git archive FETCH_HEAD assets/shaders | tar x -C "$RUNNER_TEMP/orig"

      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Configure
        id: configure
        run: cmake --preset macos-release

      - name: Save vcpkg binary cache
        if: always() && steps.setup.outputs.cache-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Build tests
        run: cmake --build --preset macos-release --target engine_tests

      - name: Tool versions
        run: |
          brew install spirv-cross spirv-tools
          brew info molten-vk | head -n 3
          spirv-cross --revision || true
          xcrun -sdk macosx metal --version || echo "no metal compiler"
          prefix="$(brew --prefix molten-vk)"
          icd=$(ls "$prefix"/etc/vulkan/icd.d/MoltenVK_icd.json "$prefix"/share/vulkan/icd.d/MoltenVK_icd.json 2>/dev/null | head -n1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # orig/ = the train's shaders; v-*/ = orig with one suspect removed.
      - name: Cook shader variants
        run: |
          set -e
          cook() { # <source root> <out dir> [gbuffer-only]
            local src="$1/assets/shaders" out="$2"
            mkdir -p "$out/materials"
            for f in "$src"/lib/*.slang; do
              slangc "$f" -I "$src/lib" -o "$out/$(basename "$f" .slang).slang-module"
            done
            local passes=("$src"/*.slang)
            [ "${3:-}" = gbuffer-only ] && passes=("$src/gbuffer.slang")
            for f in "${passes[@]}"; do
              n=$(basename "$f" .slang)
              slangc "$f" -I "$src/lib" -target spirv -emit-spirv-directly -fvk-use-entrypoint-name \
                -o "$out/$n.spv" -reflection-json "$out/$n.json"
            done
            [ "${3:-}" = gbuffer-only ] && return 0
            for f in "$src"/materials/*.slang; do
              n=$(basename "$f" .slang)
              slangc "$f" "$out/material_pass_gbuffer.slang-module" -I "$src/lib" -I "$out" \
                -target spirv -emit-spirv-directly -fvk-use-entrypoint-name \
                -o "$out/materials/$n.gbuffer.spv" -reflection-json "$out/materials/$n.gbuffer.json"
            done
          }
          variant() { # <name> <file under assets/shaders> <perl substitution>
            rm -rf "$RUNNER_TEMP/src-$1"; cp -R "$RUNNER_TEMP/orig" "$RUNNER_TEMP/src-$1"
            perl -0pi -e "$3" "$RUNNER_TEMP/src-$1/assets/shaders/$2"
            if diff -q "$RUNNER_TEMP/orig/assets/shaders/$2" "$RUNNER_TEMP/src-$1/assets/shaders/$2"; then
              echo "::warning::variant $1 changed nothing"
            fi
            cook "$RUNNER_TEMP/src-$1" "$RUNNER_TEMP/v-$1" gbuffer-only
          }
          cook "$RUNNER_TEMP/orig" "$RUNNER_TEMP/cooked-orig"
          variant no-prev-read lib/gbuffer_common.slang 's/if \(m\.has_prev_positions != 0\) prev_position = [^;]*;//'
          variant no-motion lib/gbuffer_common.slang 's/if \(pc\.has_motion != 0\) \{/if (false) {/'
          variant no-flat lib/gbuffer_common.slang 's/public nointerpolation float mirrored/public float mirrored/'
          variant no-vertex-index lib/gbuffer_common.slang 's/prev_positions\[vertex_index\(\)\]/prev_positions[0]/'
          variant five-targets lib/gbuffer_common.slang 's/public float2 *velocity *: SV_Target5;//; s/o\.velocity *= [^;]*;//'

      - name: MSL check (static)
        continue-on-error: true
        run: |
          rc=0
          for d in cooked-orig v-no-prev-read v-no-motion v-no-flat v-no-vertex-index v-five-targets; do
            echo "::group::msl-check $d"
            scripts/msl-check.sh "$RUNNER_TEMP/$d" "$RUNNER_TEMP/msl-$d" | tee "$RUNNER_TEMP/msl-$d.txt" || rc=1
            echo "::endgroup::"
            echo "== $d"; grep -v '^ok' "$RUNNER_TEMP/msl-$d.txt" | head -n 60
          done
          echo "::group::msl-check fixed (cooked/shaders)"
          scripts/msl-check.sh cooked/shaders "$RUNNER_TEMP/msl-fixed" | tee "$RUNNER_TEMP/msl-fixed.txt" || rc=1
          echo "::endgroup::"
          echo "== fixed"; grep -v '^ok' "$RUNNER_TEMP/msl-fixed.txt" | head -n 60
          exit $rc

      - name: Narrow GPU run with MoltenVK debug log (train shaders, then fixed)
        continue-on-error: true
        env:
          MVK_CONFIG_LOG_LEVEL: "4"
          MVK_CONFIG_DEBUG: "1"
        run: |
          filter='GpuInstancing.RendersEveryInstanceOfOneInstancedDraw:GpuParticleDraw.WeightedBlendedOitIsOrderIndependent:GpuTerrainPass.RasterisesTheTileUnderTheCamera:GpuGrass.DrawWritesBladesIntoTheGBuffer:GpuVelocity.TranslatingQuadMatchesItsScreenMotion'
          run() { # <label>
            MVK_CONFIG_SHADER_DUMP_DIR="$RUNNER_TEMP/mvk-dump-$1" \
              build/macos-release/engine_tests --require-gpu --gtest_filter="$filter" \
              > "$RUNNER_TEMP/mvk-$1.log" 2>&1 || true
            echo "== $1: test results"
            grep -E '^\[ *(OK|FAILED|PASSED|SKIPPED) *\]' "$RUNNER_TEMP/mvk-$1.log" | head -n 40
            echo "== $1: MoltenVK errors/warnings"
            grep -n -i -E 'mvk-error|mvk-warn|error|fail|cannot|unsupported' "$RUNNER_TEMP/mvk-$1.log" | head -n 120
          }
          mv cooked/shaders cooked/shaders.fixed
          cp -R "$RUNNER_TEMP/cooked-orig" cooked/shaders
          run orig
          rm -rf cooked/shaders; mv cooked/shaders.fixed cooked/shaders
          run fixed
          wc -l "$RUNNER_TEMP"/mvk-*.log

      - name: Tests (GPU on MoltenVK, fixed shaders)
        continue-on-error: true
        env:
          GTEST_BRIEF: 1
        run: build/macos-release/engine_tests --require-gpu --gtest_filter='Gpu*' 2>&1 | tee "$RUNNER_TEMP/gpu-full.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-mvk-diagnostics
          path: |
            ${{ runner.temp }}/mvk-*.log
            ${{ runner.temp }}/mvk-dump-*/
            ${{ runner.temp }}/msl-*.txt
            ${{ runner.temp }}/msl-*/*.metal
            ${{ runner.temp }}/gpu-full.log
          retention-days: 7
          if-no-files-found: ignore
