name: Slang bisect (temporary, #136)

# Throwaway: finds the first Slang release whose SPIR-V passes
# spirv-val --target-env vulkan1.3 (VUID-StandaloneSpirv-None-10684) and
# prints every release asset's SHA-256 digest from the GitHub API.
# Removed before the PR is marked ready.
on:
  push:
    branches: [fix/slang-spirv-layout]
    paths: ['.github/workflows/slang-bisect.yml']

permissions:
  contents: read

concurrency:
  group: slang-bisect
  cancel-in-progress: true

jobs:
  spirv-val:
    runs-on: ubuntu-24.04
    steps:
      - name: Build spirv-val (SPIRV-Tools vulkan-sdk-1.4.350.0, vcpkg's port)
        run: |
          git clone -q --depth 1 -b vulkan-sdk-1.4.350.0 https://github.com/KhronosGroup/SPIRV-Tools.git st
          git clone -q --depth 1 -b vulkan-sdk-1.4.350.0 https://github.com/KhronosGroup/SPIRV-Headers.git st/external/spirv-headers
          cmake -S st -B st/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          ninja -C st/b spirv-val spirv-dis
          mkdir out && cp st/b/tools/spirv-val st/b/tools/spirv-dis out/
          out/spirv-val --version
      - uses: actions/upload-artifact@v4
        with: { name: spirv-tools, path: out/ }

  bisect:
    needs: spirv-val
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['2025.6.1', '2025.12', '2025.19.1', '2025.20', '2025.21', '2025.24.3', '2026.1.2', '2026.10.2', '2026.22.1', '2026.23']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: spirv-tools, path: spvt }
      - name: Digests (GitHub release API)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ matrix.version }}
        run: |
          gh api "repos/shader-slang/slang/releases/tags/v$V" \
            --jq '.assets[] | select(.name | test("linux-x86_64.tar.gz$|macos-aarch64.tar.gz$|windows-x86_64.zip$")) | "DIGEST \(.name) \(.digest)"' | tee digests.txt
      - name: Download + verify slangc
        env: { V: '${{ matrix.version }}' }
        run: |
          name="slang-$V-linux-x86_64.tar.gz"
          want=$(awk -v n="$name" '$2==n {sub("sha256:","",$3); print $3}' digests.txt)
          test -n "$want"
          curl -fsSL -o slang.tgz "https://github.com/shader-slang/slang/releases/download/v$V/$name"
          echo "$want  slang.tgz" | sha256sum -c -
          mkdir slang && tar -xzf slang.tgz -C slang
          slang/bin/slangc -v || true
      - name: Cook (same flags as cmake/CompileShaders.cmake) + spirv-val
        env: { V: '${{ matrix.version }}' }
        run: |
          chmod +x spvt/*
          S=assets/shaders; O=cooked/shaders; mkdir -p $O/materials
          C=slang/bin/slangc; fail=0
          for f in $S/lib/*.slang; do n=$(basename $f .slang); $C $f -I $S/lib -o $O/$n.slang-module || { echo "MODULE-FAIL $n"; fail=1; }; done
          for f in $S/*.slang; do n=$(basename $f .slang)
            $C $f -I $S/lib -target spirv -emit-spirv-directly -fvk-use-entrypoint-name -o $O/$n.spv -reflection-json $O/$n.json 2> err.txt || { echo "COMPILE-FAIL $n"; fail=1; }
            if [ -s err.txt ]; then echo "DIAG $n:"; head -20 err.txt; fi
          done
          for f in $S/materials/*.slang; do n=$(basename $f .slang)
            $C $f $O/material_pass_gbuffer.slang-module -I $S/lib -I $O -target spirv -emit-spirv-directly -fvk-use-entrypoint-name -o $O/materials/$n.gbuffer.spv -reflection-json $O/materials/$n.gbuffer.json || { echo "COMPILE-FAIL material $n"; fail=1; }
          done
          bad=0; total=0
          for spv in $(find $O -name '*.spv' | sort); do total=$((total+1))
            if ! out=$(spvt/spirv-val --target-env vulkan1.3 "$spv" 2>&1); then bad=$((bad+1)); echo "VAL-FAIL $spv: $(echo "$out" | grep -o 'VUID[^ :]*' | sort -u | tr '\n' ' ') $(echo "$out" | head -3 | tr '\n' ' ' | cut -c1-300)"; fi
          done
          echo "RESULT v$V: $bad of $total .spv fail spirv-val; compile-fail=$fail"
          tar -czf cooked-$V.tgz cooked
      - name: New explicit-layout test against this version's cooked shaders
        run: |
          git clone -q --depth 1 -b v1.17.0 https://github.com/google/googletest.git gt
          G=gt/googletest
          g++ -std=c++23 -O1 -Wall -Wextra -Wshadow -Werror -fno-exceptions -fno-rtti -I$G/include -I$G \
            -DQUAT_COOKED_SHADER_DIR="\"$PWD/cooked/shaders\"" tests/rhi/spirv_explicit_layout_test.cpp \
            $G/src/gtest-all.cc $G/src/gtest_main.cc -o layout_test -lpthread
          ./layout_test 2>&1 | grep -E 'Failure|\.spv|PASSED|FAILED' | head -40 || true
      - name: Workaround probes
        env: { V: '${{ matrix.version }}' }
        run: |
          C=slang/bin/slangc; D=spvt/spirv-dis; mkdir -p p; cd p
          cat > inst.slang <<'X'
          struct VOut { float4 pos : SV_Position; };
          [shader("vertex")] VOut main(uint iid : SV_InstanceID) { VOut o; o.pos = float4(float(iid), 0, 0, 1); return o; }
          X
          cat > nullp.slang <<'X'
          struct PC { float* p; };
          [[vk::push_constant]] ConstantBuffer<PC> pc;
          RWStructuredBuffer<float> o;
          [shader("compute")] [numthreads(1, 1, 1)] void main() { if (pc.p != nullptr) o[0] = *pc.p; }
          X
          cat > u3.slang <<'X'
          struct PC { uint a; uint3 b; };
          [[vk::push_constant]] ConstantBuffer<PC> pc;
          RWStructuredBuffer<uint> o;
          [shader("compute")] [numthreads(1, 1, 1)] void main() { o[0] = pc.a + pc.b.x + pc.b.z; }
          X
          cat > disc.slang <<'X'
          interface IKeep { static bool keep(float a); }
          struct Opaque : IKeep { static bool keep(float a) { return true; } }
          float4 shade<K : IKeep>(float a) { if (!K::keep(a)) discard; return float4(a); }
          [shader("fragment")] float4 main(float a : A) : SV_Target { return shade<Opaque>(a); }
          X
          cat > mat.slang <<'X'
          struct PC { float4x4 m; float3x3 n; };
          [[vk::push_constant]] ConstantBuffer<PC> pc;
          RWStructuredBuffer<float4> o;
          [shader("compute")] [numthreads(1, 1, 1)] void main() { o[0] = mul(pc.m, float4(1, 2, 3, 1)) + float4(mul(pc.n, float3(1, 2, 3)), 0); }
          X
          printf 'void main() { int x = undefined_thing; }\n' > bad.slang
          F="-target spirv -emit-spirv-directly -fvk-use-entrypoint-name"
          for n in inst nullp u3 disc mat; do $C $n.slang $F -o $n.spv -reflection-json $n.json || echo "PROBE-COMPILE-FAIL $n"; done
          echo "PROBE v$V DrawParameters(SV_InstanceID): $($D inst.spv | grep -c 'Capability DrawParameters')"
          echo "PROBE v$V Int64(nullptr test): $($D nullp.spv | grep -c 'Capability Int64')"
          echo "PROBE v$V uint3-after-uint offset: $($D u3.spv | grep 'OpMemberDecorate %PC_std430 1 Offset\|OpMemberDecorate .* 1 Offset' | head -2 | tr '\n' ' ')"
          echo "PROBE v$V dead discard ops: $($D disc.spv | grep -c 'OpKill\|OpTerminateInvocation\|OpDemoteToHelperInvocation')"
          echo "PROBE v$V matrix decorations: $($D mat.spv | grep 'RowMajor\|ColMajor\|MatrixStride' | tr -s ' ' | tr '\n' ';')"
          echo "PROBE v$V matrix reflection: $(jq -c '[.. | objects | select(has("matrixLayout") or has("rowCount")) ] | .[0:3]' mat.json 2>/dev/null | cut -c1-300)"
          $C bad.slang -target spirv -o bad.spv -reflection-json bad.json > /dev/null 2>&1; echo "PROBE v$V compile error + reflection-json exit: $?"
          echo "PROBE v$V bad.spv written: $(test -e bad.spv && echo yes || echo no)"
      - uses: actions/upload-artifact@v4
        with: { name: 'cooked-${{ matrix.version }}', path: 'cooked-${{ matrix.version }}.tgz' }

  reflection-diff:
    needs: bisect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'cooked-*', merge-multiple: true }
      - name: Reflection JSON diff vs 2025.6.1 (key-sorted)
        run: |
          mkdir base && tar -xzf cooked-2025.6.1.tgz -C base
          for t in cooked-*.tgz; do v=${t#cooked-}; v=${v%.tgz}; [ "$v" = 2025.6.1 ] && continue
            mkdir -p "x/$v" && tar -xzf "$t" -C "x/$v"
            n=0
            for j in $(cd base && find cooked -name '*.json' | sort); do
              if [ -f "x/$v/$j" ]; then
                if ! diff <(jq -S . "base/$j") <(jq -S . "x/$v/$j") > d.txt; then n=$((n+1)); echo "=== $v $j"; head -60 d.txt; fi
              else echo "=== $v $j MISSING"; fi
            done
            echo "REFLDIFF v$v: $n json files differ"
          done
