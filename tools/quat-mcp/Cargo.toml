[package]
name = "quat-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model Context Protocol server that lets AI assistants build and inspect worlds in the quat-3d engine"
license = "MIT"
publish = false

[[bin]]
name = "quat-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.12", default-features = false, features = ["server", "macros", "transport-io", "schemars", "base64"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "fs", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
md-5 = "0.10"
humantime = "2"
which = "8"
percent-encoding = "2"
tempfile = "3"
yaml_serde = "0.10"
dirs = "6"

[dev-dependencies]
rmcp = { version = "3.12", default-features = false, features = ["server", "client", "macros", "transport-io", "schemars", "base64"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
